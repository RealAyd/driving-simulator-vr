learning_objective: "Emerge from a side road on to a main road: observe both ways (right first, then left, then right again), judge a safe gap in traffic from both directions, and go without making anyone slow down or swerve; wait at the line if it is not safe."
prior_actions: "You left the test centre on Warley Hill, went towards the station and turned left before it, and have followed the local streets. The examiner said: \"At the end of the road, turn left.\" You checked your mirrors, signalled left and slowed on the approach."
scene_setup: "Scene brentwood-kavanaghs-road (public/scenes, built by tools/scenes/build_scene.mjs from the OSM data above). Learner car at the end of Kavanaghs Road, front at the give way line, signalling left: at [1.65, 4.5], heading 330 degrees (scene metres). Traffic: the app's busiest setting ('Test day'), left to gather for 30 simulated seconds (capture spec: capture/spec.json)."
capture_views: # rendered from the driver's seat, landscape phone (844 x 390 at 3x), JPEG; capture/capture.json has where and when
  - forward
  - right # looking right along London Road (traffic coming towards you in the near lane)
  - left # looking left along London Road (traffic coming in the far lane, towards Brook Street)
  - right-sequence-1..3 # three frames 1 s apart looking right: how fast the nearest car is coming
learner_prompt: "You are at the end of Kavanaghs Road, signalling left, to turn left on to London Road towards Brook Street. What do you do now, and in what order?"
available_actions:
  - "Look right along London Road"
  - "Look left along London Road"
  - "Look right again"
  - "Check the left mirror (for a cyclist or a pedestrian coming up on the left)"
  - "Go now"
  - "Wait at the line"
  - "Creep forward to see more"
  - "Cancel the signal"
acceptable_responses:
  - "Look right, look left, look right again; then go only if nothing coming from the right is close enough to have to slow, and nothing from the left is overtaking or turning into Kavanaghs Road across your path"
  - "If parked cars or a hedge block the view: creep forward slowly to see, then look right, left and right again before going"
  - "If a vehicle from the right is near (it would have to slow if you came out): wait at the line, keep looking, go when there is a safe gap"
  - "Order: the final look before moving is to the right (traffic in the lane you are joining comes from the right)"
  - "Valid either way: checking the left mirror before the turn; keeping the left signal on (it tells traffic on London Road and pedestrians what you are doing)"
feedback: "Turning left out of a side road you join the near lane, where traffic comes from your right: it is the danger that matters most, so look right last before you move. Look left too, for anything overtaking towards you or turning in. Go when nobody on London Road would have to slow down or swerve for you. If a car from the right is close, waiting is correct, not hesitant; if the road is clear and you still wait, that is undue hesitation. What changes with other traffic: a bus at the stop or a parked van near the mouth hides traffic, so creep and look again; a car signalling left from the right may not turn, so wait until it does."
fault_conditions: # contextual, from the depicted traffic; the app's mock test marks the same in a drive (src/assessment/mockTest.ts)
  - "Going when a vehicle from the right (or one overtaking from the left) would have to slow or swerve: serious, Junctions – observation"
  - "Going without looking right (or with no look right in the last seconds before moving): serious if traffic is about, driving fault if the road is empty, Junctions – observation"
  - "No left signal when someone would benefit (traffic on London Road, a pedestrian at the mouth): driving fault, Signals – necessary"
  - "Waiting with a clear road both ways for some seconds: driving fault, Progress – undue hesitation (only where the captures show the road clear)"
